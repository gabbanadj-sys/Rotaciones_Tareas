<style>
  :root{
    --ink:#101826;
    --paper:#f2f4f7;
    --card:#ffffff;
    --line:#dfe3e9;
    --muted:#64748b;
    --accent:#c99a3d;
    --accent-dark:#a67c2e;
    --accent-soft:#f6ead0;
    --teal:#2b6777;
    --teal-dark:#1d4a56;
    --green:#2f855a;
    --red:#c0392b;
    --shadow: 0 1px 2px rgba(16,24,38,0.05), 0 10px 26px rgba(16,24,38,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; position:relative;
    background:var(--paper);
  }

  /* ---- header ---- */
  .topbar{
    padding:22px 20px 18px;
    padding-top:calc(22px + env(safe-area-inset-top));
    background:linear-gradient(155deg, var(--ink) 0%, #1b2a3d 100%);
    color:#fff; position:relative; overflow:hidden;
  }
  .topbar::after{
    content:""; position:absolute; right:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(201,154,61,0.18) 0%, transparent 70%);
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:var(--accent); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:15px;
  }
  .brand-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; letter-spacing:.01em; }
  .brand-sub{ font-size:10.5px; color:#9aa7ba; font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; }
  .header-date{ text-align:right; }
  .header-date .d1{ font-family:'Sora',sans-serif; font-weight:700; font-size:15px; }
  .header-date .d2{ font-size:11px; color:#9aa7ba; text-transform:capitalize; }

  .kpi-strip{ display:flex; gap:10px; margin-top:18px; position:relative; z-index:1; }
  .kpi{ flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; }
  .kpi .lbl{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#9aa7ba; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
  .kpi .val{ font-family:'Sora',sans-serif; font-weight:700; font-size:17px; color:var(--accent); }

  /* ---- content ---- */
  .content{ flex:1; padding:18px 18px 104px; overflow-y:auto; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px; }
  .section-head:first-child{ margin-top:0; }
  .section-head h2{
    font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
    color:var(--ink); margin:0; display:flex; align-items:center; gap:8px;
  }
  .section-head h2 .num{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--accent-dark);
    background:var(--accent-soft); padding:2px 7px; border-radius:4px; font-weight:600;
  }
  .section-note{ font-size:11.5px; color:var(--muted); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; }
  .quickadd{ margin-bottom:18px; }

  /* ---- wheel time picker (replaces native time input) ---- */
  .wheel-block{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .wheel-block .wb-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .wheel-group{ display:flex; align-items:center; justify-content:center; gap:4px; position:relative; }
  .wheel-col{
    width:52px; height:132px; overflow-y:scroll; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; position:relative;
  }
  .wheel-col::-webkit-scrollbar{ display:none; }
  .wheel-track{ padding:48px 0; }
  .wheel-item{
    height:36px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:15px; color:#b7bfcb;
    scroll-snap-align:center; user-select:none; transition:color .12s, font-weight .12s;
  }
  .wheel-item.wi-active{ color:var(--ink); font-weight:700; font-size:17px; }
  .wheel-sep{ font-family:'Sora',sans-serif; font-weight:800; font-size:18px; color:var(--muted); }
  .wheel-highlight{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:36px;
    border-top:1.5px solid var(--accent); border-bottom:1.5px solid var(--accent);
    pointer-events:none; background:rgba(201,154,61,0.07); border-radius:6px; z-index:2;
  }
  .wheel-fade-top, .wheel-fade-bottom{
    position:absolute; left:0; right:0; height:48px; pointer-events:none; z-index:3;
  }
  .wheel-fade-top{ top:0; background:linear-gradient(to bottom, var(--card), transparent); }
  .wheel-fade-bottom{ bottom:0; background:linear-gradient(to top, var(--card), transparent); }

  .qa-context{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px; }
  .qa-from-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 12px; text-align:center;
  }
  .qa-from-chip strong{ display:block; color:var(--ink); font-size:15px; font-family:'Sora',sans-serif; margin-top:1px; }
  .qa-context-arrow{ color:var(--line); font-size:18px; }
  .qa-hint{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin:14px 0 9px; text-align:center;
  }
  .qa-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .qa-chip{
    font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--paper); cursor:pointer;
    display:flex; align-items:center; gap:7px; -webkit-tap-highlight-color:transparent;
  }
  .qa-chip:active{ transform:scale(0.96); }
  .qa-chip .dot{ width:9px;height:9px;border-radius:3px;flex-shrink:0; }
  .qa-chip.break{ border-style:dashed; }
  .qa-chip.running{ border-color:var(--accent); background:var(--accent-soft); }

  .session-live{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .session-dot{ width:14px;height:14px; border-radius:4px; flex-shrink:0; box-shadow:0 0 0 4px rgba(0,0,0,0.04); }
  .session-info{ flex:1; min-width:0; }
  .session-task-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-since{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:1px; }
  .session-elapsed{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px; color:var(--accent-dark); white-space:nowrap; }
  .btn-stop{
    width:100%; background:var(--red); color:#fff; border:none; border-radius:9px;
    padding:12px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Sora',sans-serif;
    margin-bottom:4px;
  }
  .btn-stop:active{ opacity:0.88; }

  .date-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .date-nav button{ background:var(--card); border:1px solid var(--line); border-radius:8px; width:36px;height:36px; font-size:15px; cursor:pointer; color:var(--teal-dark); }

<body>
<div id="app">
  <div class="loading-screen" id="loadingScreen">Cargando datos…</div>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>
<div id="printReport"></div>

<script>
/* ============ DATA LAYER ============ */
const STORAGE_KEY = 'rotaciones-app-data-v4';

const PALETTE = ['#2b6777','#c99a3d','#2f855a','#c0392b','#6b4e8e','#3d7a95','#8a6b3d','#4d6b3d','#a8456b','#4a5c8a'];

const DEFAULT_TASKS = [
  'Entrada','Desplazamiento',
  'Exportación','Destinos','Expediciones','Inducir','RFID','Robot',
  'Pistolear','Reparto colonias','Inauguraciones','Recoger almacén',
  'Inducir devoluciones','Restos facturación','Estirado devoluciones',
  'Destinos devoluciones','Salida manual silo','Refuerzo estructura',
  'Cajas vacías','Remontar ubicaciones','Montar carrusel','Descanso','Comida','Salida'
];

// Tasks that represent clocking in/out, travel or breaks rather than a
// rotated work task — their time is always excluded from the per-task
// totals and stats (Historial, Estadísticas, task rankings).
const NON_WORK_TASK_NAMES = ['entrada','desplazamiento','comida','descanso','salida'];
function isNonWorkTaskName(name){
  return NON_WORK_TASK_NAMES.includes(name.trim().toLowerCase());
}
// For the daily-jornada / horas-extra calculation specifically: Entrada,
// Desplazamiento and Descanso DO count towards completing the 7,25h
// standard workday. Only Comida and Salida are left out — Comida because
// it simply doesn't count either way (it neither fulfills nor extends the
// jornada), and Salida because it's just the closing checkpoint.
const JORNADA_EXCLUDED_NAMES = ['comida','salida'];
function isJornadaExcludedTaskName(name){
  return JORNADA_EXCLUDED_NAMES.includes(name.trim().toLowerCase());
}
function computeJornadaHours(entriesList){
  return entriesList.reduce((sum,e)=>{
    const t = getTask(e.taskId);
    if(!t || isJornadaExcludedTaskName(t.name)) return sum;
    return sum + durationHours(e.start,e.end);
  }, 0);
}
// Ensures Entrada/Desplazamiento/Descanso/Comida/Salida exist and are
// flagged as non-work, even for tasks the user already created by hand
// before this existed, or state saved by an older version of the app.
function ensureNonWorkTasks(st){
  const displayNames = {entrada:'Entrada', desplazamiento:'Desplazamiento', comida:'Comida', descanso:'Descanso', salida:'Salida'};
  NON_WORK_TASK_NAMES.forEach(key=>{
    const existing = st.tasks.find(t=>t.name.trim().toLowerCase()===key);
    if(existing){
      existing.isBreak = true;
    } else {
      st.tasks.push({ id: makeId(), name: displayNames[key], color:'#94a0b3', isBreak:true });
    }
  });
  return st;
}

function makeId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function buildDefaultState(){
  const tasks = DEFAULT_TASKS.map((name,i)=>({
    id: makeId(), name,
    color: isNonWorkTaskName(name) ? '#94a0b3' : PALETTE[i % PALETTE.length],
    isBreak: isNonWorkTaskName(name)
  }));
  return ensureNonWorkTasks({ tasks, entries: [], activeSession: null, settings: { dailyStandardHours: 7.25 } });
}

let state = null;
let storageAvailable = true;
let usingLocalFallback = false;

// Uses Claude's storage bridge when this runs inside a Claude.ai artifact.
// Falls back to the browser's own localStorage when it doesn't exist —
// which is the case once this file is saved and opened directly (e.g. on
// an iPhone, added to the Home Screen). Data then stays on that device.
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGetRaw(key){
  if(hasClaudeStorage()){
    return await window.storage.get(key, false);
  }
  usingLocalFallback = true;
  const v = localStorage.getItem(key);
  if(v===null){ const err = new Error('Key not found'); err.notFound = true; throw err; }
  return { key, value:v, shared:false };
}
async function storageSetRaw(key, value){
  if(hasClaudeStorage()){
    return await window.storage.set(key, value, false);
  }
  usingLocalFallback = true;
  localStorage.setItem(key, value);
  return { key, value, shared:false };
}

async function loadState(){
  let res = null;
  let readOk = false;
  let keyMissing = false;
  for(let attempt=0; attempt<2 && !readOk; attempt++){
    try{
      res = await storageGetRaw(STORAGE_KEY);
      readOk = true;
    }catch(e){
      const msg = ((e && e.message) || '').toLowerCase();
      if(e && e.notFound || msg.includes('not found') || msg.includes('no encontrado')){
        keyMissing = true; readOk = true; // first-ever use: nothing saved yet, not an error
      } else {
        console.error('Intento '+(attempt+1)+' fallido cargando datos', e);
        if(attempt===0) await new Promise(r=>setTimeout(r,500));
      }
    }
  }
  if(keyMissing){
    state = buildDefaultState();
    await silentPersist();
    return;
  }
  if(!readOk){
    // Read genuinely failed (likely a transient server issue). Work with an
    // in-memory default so the app stays usable, but NEVER overwrite storage
    // here — if there was already saved data, this avoids wiping it out.
    state = buildDefaultState();
    showToast('No se pudieron cargar tus datos guardados (fallo temporal). Recarga la página para reintentarlo; tus registros anteriores no se han borrado.');
    return;
  }
  if(res && res.value){
    try{
      state = JSON.parse(res.value);
      if(!state.tasks) state.tasks = [];
      if(!state.entries) state.entries = [];
      if(state.activeSession===undefined) state.activeSession = null;
      if(!state.settings) state.settings = { dailyStandardHours: 7.25 };
      if(typeof state.settings.dailyStandardHours !== 'number') state.settings.dailyStandardHours = 7.25;
      ensureNonWorkTasks(state);
      await silentPersist();
    }catch(e){
      console.error('Datos guardados corruptos', e);
      state = buildDefaultState();
    }
  } else {
    state = buildDefaultState();
    await silentPersist();
  }
}

// Used for background/initial saves: never bothers the user with a toast.
async function silentPersist(){
  try{
    await storageSetRaw(STORAGE_KEY, JSON.stringify(state));
    storageAvailable = true;
  }catch(e){
    console.error('Error guardando datos', e);
    storageAvailable = false;
  }
}

let saveTimer=null;
let saveFailNotified=false;
async function persist(){
  try{
    await storageSetRaw(STORAGE_KEY, JSON.stringify(state));
    storageAvailable = true;
    saveFailNotified = false;
  }catch(e){
    console.error('Error guardando datos', e);
    storageAvailable = false;
    if(!saveFailNotified){
      showToast('No se pudo guardar. Los cambios podrían perderse.');
      saveFailNotified = true;
    }
  }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 200); }

/* ============ HELPERS ============ */
function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const wd = dt.toLocaleDateString('es-ES', {weekday:'long'});
  const md = dt.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
  return {wd, md};
}
function shortDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const wd = dt.toLocaleDateString('es-ES', {weekday:'long'});
  const dm = dt.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
  return wd.charAt(0).toUpperCase()+wd.slice(1)+' · '+dm;
}
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function durationHours(start,end){
  let mins = timeToMinutes(end) - timeToMinutes(start);
  if(mins < 0) mins += 24*60;
  return mins/60;
}
function fmtHM(hoursDecimal){
  const totalMin = Math.round(hoursDecimal*60);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  if(h===0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}
function fmtHoursDec(h){ return (Math.round(h*100)/100).toString().replace('.', ','); }
function roundedNowTime(){
  const d = new Date();
  let m = Math.round(d.getMinutes()/5)*5;
  let h = d.getHours();
  if(m===60){ m=0; h=(h+1)%24; }
  return pad(h)+':'+pad(m);
}
function getTask(id){ return state.tasks.find(t=>t.id===id); }
function sortedTasks(){
  return [...state.tasks].sort((a,b)=>a.name.localeCompare(b.name, 'es', {sensitivity:'base'}));
}
function entriesForDate(dateStr){
  return state.entries.filter(e=>e.date===dateStr).sort((a,b)=> timeToMinutes(a.start)-timeToMinutes(b.start));
}
function nextStartFor(dateStr){
  const entries = entriesForDate(dateStr);
  if(entries.length===0) return '08:00';
  return entries[entries.length-1].end;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const dt = new Date(y, m-1, 1);
  const s = dt.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function computeTaskStats(entriesList){
  const workEntries = entriesList.filter(e=>{ const t=getTask(e.taskId); return t && !t.isBreak; });
  const totalHours = workEntries.reduce((s,e)=>s+durationHours(e.start,e.end),0);
  const byTask = {};
  workEntries.forEach(e=>{
    const t = getTask(e.taskId);
    if(!t) return;
    if(!byTask[t.id]) byTask[t.id] = {task:t, count:0, hours:0};
    byTask[t.id].count += 1;
    byTask[t.id].hours += durationHours(e.start,e.end);
  });
  const rows = Object.values(byTask).sort((a,b)=>b.hours-a.hours).map(r=>({
    ...r, pct: totalHours>0 ? (r.hours/totalHours*100) : 0
  }));
  return { totalHours, count: workEntries.length, rows };
}

const WHEEL_ITEM_H = 36;
const HOUR_OPTIONS = Array.from({length:24}, (_,i)=>pad(i));
const MIN_OPTIONS = Array.from({length:60}, (_,i)=>pad(i));

function wheelColHtml(options){

// Wires up scroll-snap behaviour on a wheel block that was just inserted into the DOM.
// rootEl: the .wheel-block element. initialHHMM: 'HH:MM'. onChange(hhmm) fires whenever a value settles.
function initWheelPicker(rootEl, initialHHMM, onChange){
  const [ih, im] = initialHHMM.split(':').map(Number);
  const hourCol = rootEl.querySelector('.wheel-hours');
  const minCol = rootEl.querySelector('.wheel-mins');
  let curH = ih;
  let curM = im % 60;

  function setup(col, options, currentVal, onSettle){
    const idx = options.indexOf(pad(currentVal));
    const safeIdx = idx>=0 ? idx : 0;
    col.scrollTop = safeIdx*WHEEL_ITEM_H;
    markActive(col, safeIdx);
    let settleTimer=null;
    col.addEventListener('scroll', ()=>{
      clearTimeout(settleTimer);
      settleTimer = setTimeout(()=>{
        let idx2 = Math.round(col.scrollTop/WHEEL_ITEM_H);
        idx2 = Math.max(0, Math.min(options.length-1, idx2));
        col.scrollTo({top: idx2*WHEEL_ITEM_H, behavior:'smooth'});
        markActive(col, idx2);
        onSettle(parseInt(options[idx2],10));
      }, 110);
    });
    col.querySelectorAll('.wheel-item').forEach((item,i)=>{
      item.addEventListener('click', ()=>{
        col.scrollTo({top:i*WHEEL_ITEM_H, behavior:'smooth'});
        markActive(col, i);
        onSettle(parseInt(options[i],10));
      });
    });
  }
  function markActive(col, idx){
    col.querySelectorAll('.wheel-item').forEach((it,i)=> it.classList.toggle('wi-active', i===idx));
  }

  setup(hourCol, HOUR_OPTIONS, curH, (v)=>{ curH=v; onChange(pad(curH)+':'+pad(curM)); });
  setup(minCol, MIN_OPTIONS, curM, (v)=>{ curM=v; onChange(pad(curH)+':'+pad(curM)); });
}

function computeLiveWorkedHours(dateStr){
  let hours = computeJornadaHours(entriesForDate(dateStr));
  if(dateStr===todayStr() && state.activeSession){
    const task = getTask(state.activeSession.taskId);
    if(task && !isJornadaExcludedTaskName(task.name)){
      hours += (Date.now() - state.activeSession.startEpochMs)/3600000;
    }
  }
  return hours;
}
function extraBadgeHtml(diff){
  if(Math.abs(diff) < 0.01) return `<span class="extra-badge neutral">En jornada</span>`;
  if(diff>0) return `<span class="extra-badge up">+${fmtHM(diff)} extra</span>`;
  return `<span class="extra-badge down">-${fmtHM(-diff)}</span>`;
}

function stopActiveSession(opts){
  opts = opts || {};
  if(!state.activeSession) return;
  const session = state.activeSession;
  const now = new Date();
  const endHHMM = pad(now.getHours())+':'+pad(now.getMinutes());
  const task = getTask(session.taskId);
  if(endHHMM !== session.startHHMM){
    state.entries.push({ id: makeId(), date: session.date, start: session.startHHMM, end: endHHMM, taskId: session.taskId });
  }
  state.activeSession = null;
  scheduleSave();
  if(!opts.silent){
    render();
    showToast((task ? task.name : 'Tarea') + ' detenida');
  }
}

/* -- live elapsed-time ticker for the running session -- */
let liveElapsedHandle = null;
function stopLiveElapsedTicker(){
  if(liveElapsedHandle){ clearInterval(liveElapsedHandle); liveElapsedHandle=null; }
}
function startLiveElapsedTicker(){
  stopLiveElapsedTicker();
  const el = document.getElementById('liveElapsed');
  if(!el || !state.activeSession) return;
  function tick(){
    const el2 = document.getElementById('liveElapsed');
    if(!el2 || !state.activeSession){ stopLiveElapsedTicker(); return; }
    const secs = Math.max(0, Math.floor((Date.now() - state.activeSession.startEpochMs)/1000));
    const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
    el2.textContent = pad(h)+':'+pad(m)+':'+pad(s);
    const banner = document.getElementById('dayExtraBanner');
    if(banner && selectedDate===todayStr()) banner.outerHTML = dayExtraBannerHtml(selectedDate);
  }
  tick();
  liveElapsedHandle = setInterval(tick, 1000);
}

function logRow(e){
  const task = getTask(e.taskId);
  if(!task) return '';
  const h = durationHours(e.start,e.end);
  return `
    <div class="log-row" data-edit="${e.id}">
      <div class="log-time">${e.start}<br>${e.end}</div>
      <div class="log-task"><span class="dot" style="background:${task.color}"></span><span class="name">${task.name}</span></div>
      <div class="log-dur">${task.isBreak ? '—' : fmtHM(h)}</div>
      <div class="log-chevron">›</div>
    </div>`;
}

/* ---- ESTADISTICAS ---- */
function donutGradient(rows){
  if(rows.length===0) return 'conic-gradient(#e2e5ea 0% 100%)';
  let acc=0; const stops=[];
  rows.forEach(r=>{
    const start=acc, end=acc+r.pct;
    stops.push(`${r.task.color} ${start}% ${end}%`);
    acc=end;
  });
  if(acc<100) stops.push(`#e2e5ea ${acc}% 100%`);
  return `conic-gradient(${stops.join(', ')})`;
}

function computePreviousPeriodStats(){
  if(statsPeriodType==='all') return null;
  let prevDay=null, prevMonth=null, prevYear=null;
  if(statsPeriodType==='day'){
    const [y,m,d] = statsDayValue.split('-').map(Number);
    const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()-1);
    prevDay = dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  } else if(statsPeriodType==='month'){
    const [y,m] = statsMonthValue.split('-').map(Number);
    let py=y, pm=m-1; if(pm===0){ pm=12; py=y-1; }
    prevMonth = py+'-'+pad(pm);
  } else if(statsPeriodType==='year'){
    prevYear = (parseInt(statsYearValue,10)-1).toString();
  }
  return computeTaskStats(filterEntriesByPeriod(statsPeriodType, prevDay, prevMonth, prevYear));
}
function deltaBadgeHtml(current, previous){
  if(previous===null) return '';
  const diff = current - previous;
  if(Math.abs(diff) < 0.01 && previous===0) return `<div class="kpi-delta neutral">Sin datos previos</div>`;
  const sign = diff>0 ? '▲' : (diff<0 ? '▼' : '●');
  const cls = diff>0 ? 'up' : (diff<0 ? 'down' : 'neutral');
  return `<div class="kpi-delta ${cls}">${sign} ${fmtHoursDec(Math.abs(diff))}h vs anterior</div>`;
}

        <div class="lbl">Horas totales</div>
        <div class="val">${fmtHoursDec(stats.totalHours)}h</div>
        ${prevStats ? deltaBadgeHtml(stats.totalHours, prevStats.totalHours) : ''}
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Registros</div>
        <div class="val">${stats.count}</div>
        <div class="kpi-delta neutral">${stats.rows.length} tareas distintas</div>
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Media por registro</div>
        <div class="val">${fmtHM(avgPerEntry)}</div>
        <div class="kpi-delta neutral">por entrada registrada</div>
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Tarea principal</div>
        <div class="val" style="font-size:14.5px;line-height:1.3;">${topTask ? topTask.task.name : '—'}</div>
        <div class="kpi-delta neutral">${topTask ? topTask.pct.toFixed(1)+'% del periodo' : ''}</div>
      </div>
    </div>`;

  const rankingRows = stats.rows.map((r,i)=>`
      <div class="stat-row">
        <div class="top">
          <div class="name"><span class="rank-badge">${i+1}</span><span class="dot" style="background:${r.task.color}"></span>${r.task.name}</div>
          <div class="figures"><b>${r.count}×</b> · <b>${fmtHoursDec(r.hours)}h</b> · <b>${r.pct.toFixed(1)}%</b></div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${r.pct}%;background:${r.task.color}"></div></div>
      </div>`).join('');

  return chips + picker
    + `<div class="section-head"><h2>Panel del periodo <span class="num">${label}</span></h2></div>`
    + kpiGrid
    + summaryCardHtml(stats, label)
    + `<div class="section-head"><h2>Clasificación de tareas <span class="num">${stats.rows.length}</span></h2></div>`
    + rankingRows;
}

/* ---- EXTRAS (horas extra sobre la jornada estándar) ---- */
function renderExtras(){
  const standard = state.settings.dailyStandardHours;
  const chips = `<div class="month-scroller">${periodTypeChipsHtml('extras', extrasPeriodType)}</div>`;
  const picker = `<div class="card" style="margin-bottom:14px;">${periodPickerFieldHtml('extras', extrasPeriodType, extrasDayValue, extrasMonthValue, extrasYearValue)}</div>`;

  const standardSetting = `
    <div class="card" style="margin-bottom:18px;">
      <label class="field-label">Jornada diaria estándar</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="number" id="dailyStandardInput" step="0.25" min="0" max="24" value="${standard}" style="width:100px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);">horas / día (${fmtHM(standard)})</span>
      </div>
      <div class="section-note" style="margin-top:10px;">Para este cálculo, Entrada, Desplazamiento y Descanso sí cuentan como parte de la jornada. Comida y Salida no suman ni restan.</div>
    </div>`;

  const filtered = filterEntriesByPeriod(extrasPeriodType, extrasDayValue, extrasMonthValue, extrasYearValue);
  const dates = [...new Set(filtered.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));

  if(dates.length===0){
    return chips + picker + standardSetting + `<div class="empty-state"><div class="big">Sin registros en este periodo</div>Prueba con otro día, mes o año.</div>`;
  }

  let totalExtra=0, totalDeficit=0, daysOver=0, daysUnder=0, daysOnTarget=0;
  const dayRows = dates.map(d=>{
    const dayHours = computeJornadaHours(entriesForDate(d));
    const diff = dayHours - standard;
    if(diff > 0.01){ totalExtra += diff; daysOver++; }
    else if(diff < -0.01){ totalDeficit += -diff; daysUnder++; }
    else { daysOnTarget++; }
    return { date:d, hours:dayHours, diff };
  });

  const kpiGrid = `<div class="stats-kpi-grid">
      <div class="stats-kpi-card">
        <div class="lbl">Horas extra</div>
        <div class="val" style="color:var(--green);">+${fmtHoursDec(totalExtra)}h</div>
        <div class="kpi-delta neutral">${daysOver} día${daysOver===1?'':'s'} con exceso</div>
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Horas de menos</div>
        <div class="val" style="color:${totalDeficit>0?'var(--red)':'var(--ink)'};">${totalDeficit>0?'-':''}${fmtHoursDec(totalDeficit)}h</div>
        <div class="kpi-delta neutral">${daysUnder} día${daysUnder===1?'':'s'} por debajo</div>
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Balance neto</div>
        <div class="val" style="color:${(totalExtra-totalDeficit)>=0?'var(--green)':'var(--red)'};">${(totalExtra-totalDeficit)>=0?'+':''}${fmtHoursDec(totalExtra-totalDeficit)}h</div>
        <div class="kpi-delta neutral">extra menos déficit</div>
      </div>
      <div class="stats-kpi-card">
        <div class="lbl">Días en jornada</div>
        <div class="val">${daysOnTarget}</div>
        <div class="kpi-delta neutral">de ${dates.length} días trabajados</div>
      </div>
    </div>`;

  const rows = dayRows.map(r=>{
    const badgeColor = r.diff>0.01 ? 'var(--green)' : (r.diff<-0.01 ? 'var(--red)' : 'var(--muted)');
    const badgeText = r.diff>0.01 ? '+'+fmtHM(r.diff) : (r.diff<-0.01 ? '-'+fmtHM(-r.diff) : 'En jornada');
    return `
      <div class="log-row" style="grid-template-columns:1fr 70px 90px;cursor:default;">
        <div class="log-task"><span class="name">${shortDateLabel(r.date)}</span></div>
        <div class="log-dur">${fmtHM(r.hours)}</div>
        <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:${badgeColor};">${badgeText}</div>
      </div>`;
  }).join('');

  return chips + picker + standardSetting + kpiGrid
    + `<div class="section-head"><h2>Desglose por día <span class="num">${dates.length}</span></h2></div>`
    + `<div class="log-table"><div class="log-head" style="grid-template-columns:1fr 70px 90px;"><div>Día</div><div>Horas</div><div style="text-align:right">Extra</div></div>${rows}</div>`;
}

function getReportEntries(){
  if(reportPeriodType==='day') return entriesForDate(reportDayValue);
  if(reportPeriodType==='month') return state.entries.filter(e=>monthKey(e.date)===reportMonthValue);
  if(reportPeriodType==='year') return state.entries.filter(e=>e.date.slice(0,4)===reportYearValue);
  return state.entries.slice();
}
function getReportPeriodLabel(){
  if(reportPeriodType==='day') return dateLabel(reportDayValue).md;
  if(reportPeriodType==='month') return monthLabel(reportMonthValue);
  if(reportPeriodType==='year') return 'Año '+reportYearValue;
  return 'Historial completo';
}

function buildPrintHTML(){
  const entries = getReportEntries();
  const stats = computeTaskStats(entries);
  const dates = [...new Set(entries.map(e=>e.date))].sort();
  const genDate = new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});

  let logHtml = '';
  dates.forEach(d=>{
    const dayEntries = entriesForDate(d);
    const {wd, md} = dateLabel(d);
    logHtml += `<tr><td colspan="4" class="pr-day-label">${wd.charAt(0).toUpperCase()+wd.slice(1)}, ${md}</td></tr>`;
    dayEntries.forEach(e=>{
      const task = getTask(e.taskId);
      if(!task) return;
      const h = durationHours(e.start,e.end);
      logHtml += `<tr><td>${e.start} – ${e.end}</td><td>${task.name}</td><td>${task.isBreak?'Descanso':''}</td><td style="text-align:right;">${task.isBreak?'—':fmtHM(h)}</td></tr>`;
    });
  });

  let statsHtml = '';
  stats.rows.forEach(r=>{
    statsHtml += `<tr><td>${r.task.name}</td><td>${r.count}</td><td>${fmtHoursDec(r.hours)} h</td><td>${r.pct.toFixed(1)}%</td></tr>`;
  });

  return `
    <div class="pr-header">
      <div>
        <div class="pr-title">Informe de Rotación de Tareas</div>
        <div class="pr-sub">Periodo: ${getReportPeriodLabel()}</div>
      </div>
      <div class="pr-meta">Generado el ${genDate}<br>${stats.count} registros</div>
    </div>

    <div class="pr-section-title">Resumen por tarea</div>
    <table class="pr-table">
      <thead><tr><th>Tarea</th><th>Nº veces</th><th>Horas totales</th><th>% sobre horas trabajadas</th></tr></thead>
      <tbody>${statsHtml || '<tr><td colspan="4">Sin datos</td></tr>'}</tbody>
    </table>
    <div class="pr-totalsline"><span>Total horas trabajadas</span><span>${fmtHoursDec(stats.totalHours)} h</span></div>

    <div class="pr-section-title">Registro detallado</div>
    <table class="pr-table">
      <thead><tr><th>Horario</th><th>Tarea</th><th></th><th style="text-align:right;">Duración</th></tr></thead>
      <tbody>${logHtml || '<tr><td colspan="4">Sin registros</td></tr>'}</tbody>
    </table>

    <div class="pr-footer">Rotaciones de Tareas — informe generado automáticamente</div>
  `;
}

/* ============ EVENT HANDLERS ============ */
function attachContentHandlers(){
  document.getElementById('prevDay')?.addEventListener('click', ()=>{
    const d = new Date(selectedDate); d.setDate(d.getDate()-1);
    selectedDate = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    render();
  });
  document.getElementById('nextDay')?.addEventListener('click', ()=>{
    const d = new Date(selectedDate); d.setDate(d.getDate()+1);
    selectedDate = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    render();
  });

  document.getElementById('stopSessionBtn')?.addEventListener('click', ()=>{
    stopActiveSession();
  });
  document.getElementById('manualEntryLink')?.addEventListener('click', ()=> openEntrySheet());

  document.querySelectorAll('[data-quicktask]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const taskId = btn.dataset.quicktask;
      const task = getTask(taskId);
      if(state.activeSession && state.activeSession.taskId===taskId){
        // tapping the running task again: just stop it
        stopActiveSession();
        return;
      }
      if(state.activeSession){
        // switch tasks: stop the current one, then start the new one immediately
        stopActiveSession({ silent:true });
      }
      const now = new Date();
      state.activeSession = { taskId, date: selectedDate, startEpochMs: now.getTime(), startHHMM: pad(now.getHours())+':'+pad(now.getMinutes()) };
      scheduleSave();
      render();
      showToast(task.name+' iniciada');
    });
  });

  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const entry = state.entries.find(x=>x.id===el.dataset.edit);
      if(entry) openEntrySheet(entry);
    });
  });

  document.querySelectorAll('[data-historialtype]').forEach(el=>{
    el.addEventListener('click', ()=>{ historialPeriodType = el.dataset.historialtype; renderContent(); });
  });
  document.getElementById('historialDayInput')?.addEventListener('change', (e)=>{ historialDayValue = e.target.value; renderContent(); });
  document.getElementById('historialMonthInput')?.addEventListener('change', (e)=>{ historialMonthValue = e.target.value; renderContent(); });
  document.getElementById('historialYearInput')?.addEventListener('change', (e)=>{ historialYearValue = e.target.value; renderContent(); });

  document.querySelectorAll('[data-statstype]').forEach(el=>{
    el.addEventListener('click', ()=>{ statsPeriodType = el.dataset.statstype; renderContent(); });
  });
  document.getElementById('statsDayInput')?.addEventListener('change', (e)=>{ statsDayValue = e.target.value; renderContent(); });
  document.getElementById('statsMonthInput')?.addEventListener('change', (e)=>{ statsMonthValue = e.target.value; renderContent(); });
  document.getElementById('statsYearInput')?.addEventListener('change', (e)=>{ statsYearValue = e.target.value; renderContent(); });

  document.querySelectorAll('[data-extrastype]').forEach(el=>{
    el.addEventListener('click', ()=>{ extrasPeriodType = el.dataset.extrastype; renderContent(); });
  });
  document.getElementById('extrasDayInput')?.addEventListener('change', (e)=>{ extrasDayValue = e.target.value; renderContent(); });
  document.getElementById('extrasMonthInput')?.addEventListener('change', (e)=>{ extrasMonthValue = e.target.value; renderContent(); });
  document.getElementById('extrasYearInput')?.addEventListener('change', (e)=>{ extrasYearValue = e.target.value; renderContent(); });
  document.getElementById('dailyStandardInput')?.addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value);
    if(!isNaN(v) && v>=0){ state.settings.dailyStandardHours = v; scheduleSave(); }
    renderContent();
  });

  document.querySelectorAll('[data-reporttype]').forEach(el=>{
    el.addEventListener('click', ()=>{ reportPeriodType = el.dataset.reporttype; renderContent(); });
  });
  document.getElementById('reportDayInput')?.addEventListener('change', (e)=>{ reportDayValue = e.target.value; });
  document.getElementById('reportMonthInput')?.addEventListener('change', (e)=>{ reportMonthValue = e.target.value; });
  document.getElementById('reportYearInput')?.addEventListener('change', (e)=>{ reportYearValue = e.target.value; });
  document.getElementById('printOnlyBtn')?.addEventListener('click', ()=>{
    const el = document.getElementById('printReport');
    el.innerHTML = buildPrintHTML();
    window.print();
  });
  document.getElementById('savePdfBtn')?.addEventListener('click', ()=>{
    const el = document.getElementById('printReport');
    el.innerHTML = buildPrintHTML();
    showToast('En el cuadro que se abre, elige "Guardar como PDF"');
    window.print();
  });
  document.getElementById('shareReportBtn')?.addEventListener('click', async ()=>{
    const entries = getReportEntries();
    const stats = computeTaskStats(entries);
    const lines = [`Informe de Rotación de Tareas — ${getReportPeriodLabel()}`, `Horas trabajadas: ${fmtHoursDec(stats.totalHours)} h`, ''];
    stats.rows.forEach(r=> lines.push(`${r.task.name}: ${r.count}× · ${fmtHoursDec(r.hours)}h · ${r.pct.toFixed(1)}%`));
    const text = lines.join('\n');
    if(navigator.share){
      try{ await navigator.share({ title:'Informe de Rotación de Tareas', text }); }
      catch(e){ /* cancelled */ }
    } else {
      try{
        await navigator.clipboard.writeText(text);
        showToast('Resumen copiado al portapapeles');
      }catch(e){
        showToast('No se pudo compartir en este dispositivo');
      }
    }
  });

  document.querySelectorAll('[data-deltask]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.deltask;
      const inUse = state.entries.some(e=>e.taskId===id);
      if(inUse && !confirm('Esta tarea tiene registros asociados. ¿Eliminarla igualmente?')) return;
      state.tasks = state.tasks.filter(t=>t.id!==id);
      scheduleSave();
      renderContent();
      showToast('Tarea eliminada');
    });
  });
  document.querySelectorAll('[data-recolor]').forEach(d=>{
    d.addEventListener('click', ()=>{
      const id = d.dataset.recolor;
      const task = getTask(id);
      const idx = PALETTE.indexOf(task.color);
      task.color = PALETTE[(idx+1) % PALETTE.length];
      scheduleSave();
      renderContent();
    });
  });
  document.getElementById('addTaskBtn')?.addEventListener('click', ()=>{
    const input = document.getElementById('newTaskName');
    const name = input.value.trim();
    if(!name) return;
    state.tasks.push({ id: makeId(), name, color: PALETTE[state.tasks.length % PALETTE.length], isBreak:false });
    scheduleSave();
    input.value='';
    renderContent();
    showToast('Tarea añadida');
  });
  document.querySelectorAll('[data-resettype]').forEach(el=>{
    el.addEventListener('click', ()=>{ resetPeriodType = el.dataset.resettype; renderContent(); });
  });
  document.getElementById('resetDayInput')?.addEventListener('change', (e)=>{ resetDayValue = e.target.value; renderContent(); });
  document.getElementById('resetMonthInput')?.addEventListener('change', (e)=>{ resetMonthValue = e.target.value; renderContent(); });
  document.getElementById('resetYearInput')?.addEventListener('change', (e)=>{ resetYearValue = e.target.value; renderContent(); });
  document.getElementById('resetPeriodBtn')?.addEventListener('click', async ()=>{
    const toDeleteIds = filterEntriesByPeriod(resetPeriodType, resetDayValue, resetMonthValue, resetYearValue).map(e=>e.id);
    if(toDeleteIds.length===0){ showToast('No hay registros en ese periodo'); return; }
    const label = periodLabelText(resetPeriodType, resetDayValue, resetMonthValue, resetYearValue);
    if(!confirm(`¿Eliminar ${toDeleteIds.length} registro(s) de "${label}"? Esta acción no se puede deshacer.`)) return;
    const idSet = new Set(toDeleteIds);
    state.entries = state.entries.filter(e=>!idSet.has(e.id));
    await persist();
    render();
    showToast(toDeleteIds.length+' registro(s) eliminados');
  });
}

/* ============ ENTRY SHEET (edit / manual add) ============ */
let editingEntryId = null;
function openEntrySheet(entry){
  editingEntryId = entry ? entry.id : null;
  const overlay = document.getElementById('sheetOverlay');
  const content = document.getElementById('sheetContent');
  sheetStartTime = entry ? entry.start : nextStartFor(selectedDate);
  sheetEndTime = entry ? entry.end : roundedNowTime();
  const dateVal = entry ? entry.date : selectedDate;
  let selectedTaskId = entry ? entry.taskId : (sortedTasks()[0]?.id || '');

  content.innerHTML = `
    <div class="sheet-handle"></div>
    <h3>${entry ? 'Editar registro' : 'Registro manual'}</h3>
    <div class="form-field">
      <label class="field-label">Fecha</label>
      <input type="date" id="fEntryDate" value="${dateVal}">
    </div>
    <div class="wheel-pair">
      <div id="sheetStartWrap">${wheelPickerHtml('Inicio')}</div>
      <div id="sheetEndWrap">${wheelPickerHtml('Fin')}</div>
    </div>
    <div class="form-field">
      <label class="field-label">Tarea</label>
      <div class="quick-tasks" id="quickTasks">
        ${sortedTasks().map(t=>`
          <button type="button" class="quick-task-btn ${t.id===selectedTaskId?'sel':''}" data-task="${t.id}">
            <span class="dot" style="background:${t.color}"></span>${t.name}
          </button>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      ${entry ? '<button class="btn-danger" id="deleteEntryBtn">Eliminar</button>' : '<button class="btn-secondary" id="cancelSheet">Cancelar</button>'}
      <button class="btn-primary" id="saveEntryBtn">Guardar</button>
    </div>
  `;
  overlay.classList.add('open');

  initWheelPicker(document.getElementById('sheetStartWrap').querySelector('.wheel-block'), sheetStartTime, (val)=>{ sheetStartTime = val; });
  initWheelPicker(document.getElementById('sheetEndWrap').querySelector('.wheel-block'), sheetEndTime, (val)=>{ sheetEndTime = val; });

  content.querySelectorAll('[data-task]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedTaskId = btn.dataset.task;
      content.querySelectorAll('[data-task]').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
    });
  });
  document.getElementById('cancelSheet')?.addEventListener('click', closeSheet);
  document.getElementById('deleteEntryBtn')?.addEventListener('click', ()=>{
    if(!confirm('¿Eliminar este registro?')) return;
    state.entries = state.entries.filter(x=>x.id!==editingEntryId);
    scheduleSave();
    closeSheet();
    render();
    showToast('Registro eliminado');
  });
  document.getElementById('saveEntryBtn').addEventListener('click', ()=>{
    const date = document.getElementById('fEntryDate').value;
    const start = sheetStartTime;
    const end = sheetEndTime;
    if(!date || !start || !end || !selectedTaskId){ showToast('Completa fecha, horas y tarea'); return; }
    if(editingEntryId){
      const e = state.entries.find(x=>x.id===editingEntryId);
      Object.assign(e, {date, start, end, taskId:selectedTaskId});
    } else {
      state.entries.push({ id: makeId(), date, start, end, taskId:selectedTaskId });
    }
    scheduleSave();
    closeSheet();
    selectedDate = date;
    render();
    showToast('Guardado');
  });
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  editingEntryId = null;
}
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='sheetOverlay') closeSheet();
});
window.addEventListener('afterprint', ()=>{
  const el = document.getElementById('printReport');
  if(el) el.innerHTML = '';
});

/* ============ INIT ============ */
(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
